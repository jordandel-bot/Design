<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Webapp Studio</title>
  </head>

  <body>
    <form method="" action="">
      <div class="hero">
        <img class="front" src="front.png" alt="Description" />
      </div>
      <h1>Choisir mon expérience :</h1>
      <div>
        <label>
          <input type="radio" name="geo" value="active" />
          Activer la géolocalisation
          <img
            class="geo-icon"
            src="geo-gps-on.png"
            alt="Activer la géolocalisation"
          />
        </label>
      </div>
      <div>
        <label>
          <input type="radio" name="geo" value="defaut" />
          Utiliser l’adresse par défaut
          <img
            class="default-adress"
            src="geo-gps-off.png"
            alt="Utiliser l’adresse par défaut"
          />
        </label>
      </div>
      <button>Continuer</button>
    </form>
  </body>
</html>
