<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Webapp Studio</title>
  </head>

  <body>
    <form class="has-selection">
      <div class="hero">
        <img class="front" src="front.png" alt="Description" />
      </div>
      <h1>Choisir mon expérience :</h1>
      <div>
        <label>
          <input type="radio" name="geo" value="active" />
          Activer la géolocalisation
          <img
            class="geo-icon"
            src="geo-gps-on.png"
            alt="Activer la géolocalisation"
          />
        </label>
      </div>
      <div>
        <label>
          <input type="radio" name="geo" value="defaut" />
          Utiliser l’adresse par défaut
          <img
            class="default-adress"
            src="geo-gps-off.png"
            alt="Utiliser l’adresse par défaut"
          />
        </label>
      </div>
      <div class="form-actions">
        <button
          class="btn btn-continue"
          type="submit"
          aria-label="Continuer"
          disabled
          aria-disabled="true"
        >
          Continuer
        </button>
      </div>
    </form>
    <script>
      (function () {
        const form = document.querySelector("form");
        if (!form) return;

        const radios = Array.from(
          form.querySelectorAll("input[type='radio'][name]"),
        );
        const btn = form.querySelector(".btn-continue");

        if (!btn || radios.length === 0) return;

        const updateState = () => {
          const anyChecked = radios.some((r) => r.checked);
          form.classList.toggle("has-selection", anyChecked);
          // Désactive/active le bouton de façon accessible
          btn.disabled = !anyChecked;
          btn.setAttribute("aria-disabled", String(!anyChecked));
        };

        // Écouteurs
        radios.forEach((r) => r.addEventListener("change", updateState));

        // Initialisation au chargement (au cas où une option serait pré-cochée)
        document.addEventListener("DOMContentLoaded", updateState);
        // Et exécution immédiate si le script est chargé après le DOM
        updateState();
      })();
    </script>
  </body>
</html>
